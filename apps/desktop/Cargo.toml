[package]
name = "firmius-desktop"
version = "0.0.7"
edition = "2024"
publish = false

[build-dependencies]
slint-build = "1.17.1"

[dependencies]
pulldown-cmark = "0.13"
chrono = { version = "0.4", features = ["clock"] }
firmius-client = { path = "../../crates/client" }
firmius-core = { path = "../../crates/core" }
firmius-protocol = { path = "../../crates/protocol" }
slint = { version = "1.17.1", features = ["raw-window-handle-06"] }
serde_json = "1"
tokio = { workspace = true, features = ["full"] }
unicode-width = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"