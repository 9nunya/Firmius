name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release (e.g. v0.1.0)'
        required: true
        default: 'v0.0.0-test'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs_on: ubuntu-latest
            archive_ext: tar.gz
            artifact_name: firmius-linux-x86_64
          - target: macos-x86_64
            runs_on: macos-13           # x86_64 Intel runner (macos-latest has switched to arm64)
            archive_ext: tar.gz
            artifact_name: firmius-macos-x86_64
          - target: macos-arm64
            runs_on: macos-latest       # macos-latest is arm64 (Apple Silicon)
            archive_ext: tar.gz
            artifact_name: firmius-macos-arm64
          - target: windows-x86_64
            runs_on: windows-latest
            archive_ext: zip
            artifact_name: firmius-windows-x86_64
            shell: msys2 {0}

    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libcurl4-openssl-dev libsqlite3-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja pkg-config curl sqlite

      - name: Install MSYS2 toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-tools-git

      - name: Configure (POSIX)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=staging

      - name: Configure (Windows/MSYS2)
        if: runner.os == 'Windows'
        env:
          CC: gcc
          CXX: g++
          PKG_CONFIG_PATH: /mingw64/lib/pkgconfig
          PATH: /mingw64/bin:/usr/bin:${PATH}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=staging

      - name: Build
        run: cmake --build build --parallel --target firmius firmius_audit

      - name: Stage install (POSIX)
        if: runner.os != 'Windows'
        run: |
          cmake --install build --prefix "${PWD}/staging" --component Runtime || \
            cmake --install build --prefix "${PWD}/staging"
          # Layout the release directory.
          rm -rf release
          mkdir -p release/firmius/bin
          mkdir -p release/firmius/share/firmius
          cp staging/bin/firmius release/firmius/bin/
          if [ -f staging/bin/firmiusd ]; then cp staging/bin/firmiusd release/firmius/bin/; fi
          if [ -d staging/share/firmius ]; then cp -R staging/share/firmius/. release/firmius/share/firmius/; fi
          # Bundle docs, license, README so installers can lay them down.
          cp README.md release/firmius/
          cp -R docs release/firmius/ 2>/dev/null || true
          cp -R prompts release/firmius/ 2>/dev/null || true
          cp -R workflows release/firmius/ 2>/dev/null || true
          cp -R hinting release/firmius/ 2>/dev/null || true
          cp -R themes release/firmius/ 2>/dev/null || true
          # Drop the platform installer.
          cp scripts/install/install.sh release/firmius/install.sh
          chmod +x release/firmius/install.sh

      - name: Stage install (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --install build --prefix "${PWD}/staging" --component Runtime || \
            cmake --install build --prefix "${PWD}/staging"
          rm -rf release
          mkdir -p release/firmius/bin
          mkdir -p release/firmius/share/firmius
          cp staging/bin/firmius.exe release/firmius/bin/
          if [ -f staging/bin/firmiusd.exe ]; then cp staging/bin/firmiusd.exe release/firmius/bin/; fi
          # Copy MinGW runtime DLLs so the binary runs on machines without MSYS2.
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll \
                     libcurl-4.dll libsqlite3-0.dll libssh2-1.dll \
                     libssl-3-x64.dll libcrypto-3-x64.dll \
                     zlib1.dll libidn2-0.dll libpsl-5.dll libnghttp2-14.dll \
                     libbrotlidec.dll libbrotlicommon.dll libzstd.dll \
                     libiconv-2.dll libintl-8.dll libunistring-5.dll; do
            if [ -f "/mingw64/bin/$dll" ]; then
              cp "/mingw64/bin/$dll" "release/firmius/bin/"
            fi
          done
          if [ -d staging/share/firmius ]; then cp -R staging/share/firmius/. release/firmius/share/firmius/; fi
          cp README.md release/firmius/
          cp -R docs release/firmius/ 2>/dev/null || true
          cp -R prompts release/firmius/ 2>/dev/null || true
          cp -R workflows release/firmius/ 2>/dev/null || true
          cp -R hinting release/firmius/ 2>/dev/null || true
          cp -R themes release/firmius/ 2>/dev/null || true
          # Drop the Windows installers.
          cp scripts/install/install.bat release/firmius/install.bat
          cp scripts/install/install.ps1 release/firmius/install.ps1

      - name: Package (POSIX tar.gz)
        if: runner.os != 'Windows'
        run: |
          cd release
          tar -czf "../${{ matrix.artifact_name }}-${{ steps.tag.outputs.name }}.tar.gz" firmius

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path release/firmius -DestinationPath "${{ matrix.artifact_name }}-${{ steps.tag.outputs.name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}-${{ steps.tag.outputs.name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Firmius ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
