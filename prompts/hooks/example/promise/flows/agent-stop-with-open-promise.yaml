id: promise.flow.agent-stop-with-open-promise
description: |
  When the runtime fires agent_stop and a promise is open, spawn Shrike to
  validate the completion attempt. Shrike may seal the pact or deny the stop
  with notes that are injected into the promised agent.

trigger:
  on_event: agent_stop
  match:
    state.thread.promise.state: { equals: open }
    state.thread.promise.id: { present: true }
  block: true

action:
  kind: script
  language: luau
  script_file: ../scripts/agent_stop_validator.lua
