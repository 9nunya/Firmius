id: promise
title: Promise / Ralph Loop
version: 0.1.0
description: |
  Adds an external agent_stop validator loop for /promise pacts. When the
  promised agent tries to stop with an open pact, Shrike validates transcript
  and tool evidence. Accept seals the pact; reject denies the stop and injects
  Shrike's notes back into the agent.

# Hooks declare which scopes their state may touch. The runtime shows this
# to the user on install and refuses writes outside the declared surface.
state_surface:
  scopes: [thread]
  paths:
    - promise.id
    - promise.brief
    - promise.done_when
    - promise.validator
    - promise.iteration
    - promise.max_iterations
    - promise.state
    - promise.history[]

# Personas this pack expects in the registry.
requires_personas:
  - shrike    # default validator

# TUI status is rendered by skin/status.lua reading durable hook state.

# Runnable workflow files in this pack. The loader treats this as the active
# surface so stale files left by directory-based installs are ignored.
files:
  - commands/promise.yaml
  - flows/agent-stop-with-open-promise.yaml

# Authoring notes:
#   - Flows are defined in flows/*.yaml and loaded from the hook directory.
#   - Scripts live beside the pack and run through the Luau hook runtime.
#   - Optional renderers live in skin/ and read durable hook state.
