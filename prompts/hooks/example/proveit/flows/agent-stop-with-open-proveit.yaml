id: proveit.flow.agent-stop-with-open-proveit
description: |
  When the runtime fires agent_stop and an evidence contract is open,
  validate the final answer against the collected evidence ledger.

trigger:
  on_event: agent_stop
  match:
    state.thread.proveit.state: { equals: open }
    state.thread.proveit.id: { present: true }
  block: true

action:
  kind: script
  language: luau
  script_file: ../scripts/agent_stop_validator.lua
