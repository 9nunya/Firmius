[workspace]
members = ["crates/firmius", "crates/core", "crates/audits"]
resolver = "3"

[workspace.dependencies]
dirs = "6"
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "process", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
regex = "1"
globset = "0.4"
indexmap = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
